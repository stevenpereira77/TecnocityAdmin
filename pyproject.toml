[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tecnocity-admin-v1"
version = "1.10.0"
description = "Sistema administrativo de escritorio para Tecnocity. v1.10.0: catálogo visual de productos con imágenes optimizadas y persistentes."
requires-python = ">=3.11,<3.14"
dependencies = [
    "PySide6>=6.8,<7",
    "SQLAlchemy>=2.0,<3",
    "openpyxl>=3.1,<4",
    "reportlab>=4,<5",
    "google-api-python-client>=2.0,<3",
    "google-auth-oauthlib>=1.0,<2",
    "google-auth-httplib2>=0.2,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
tecnocity-admin = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
